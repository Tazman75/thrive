<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" fill="none">
  <!-- Background -->
  <rect width="1200" height="628" fill="#5B7B6A"/>

  <!-- Subtle texture overlay -->
  <rect width="1200" height="628" fill="url(#grain)" opacity="0.03"/>

  <!-- Soft gradient overlay for depth -->
  <rect width="1200" height="628" fill="url(#bg-gradient)"/>

  <!-- Decorative circles -->
  <circle cx="950" cy="314" r="280" fill="white" opacity="0.04"/>
  <circle cx="980" cy="314" r="220" fill="white" opacity="0.04"/>

  <!-- Left decorative accent line -->
  <line x1="80" y1="180" x2="80" y2="448" stroke="white" stroke-width="1" opacity="0.15"/>

  <!-- Leaf icon - centered right -->
  <g transform="translate(880, 200) scale(0.55)">
    <path
      d="M150 0C150 0 60 70 60 200C60 245 95 280 150 280C205 280 240 245 240 200C240 70 150 0 150 0Z"
      fill="white"
      opacity="0.12"
    />
    <path
      d="M150 0C150 0 60 70 60 200C60 245 95 280 150 280C205 280 240 245 240 200C240 70 150 0 150 0Z"
      stroke="white"
      stroke-width="4"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.7"
    />
    <!-- Center vein -->
    <path d="M150 280V140" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <!-- Left vein -->
    <path d="M150 230C120 215 105 190 108 168" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
    <!-- Right vein -->
    <path d="M150 195C180 183 190 163 188 143" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Main text block - left aligned -->
  <text x="120" y="265" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="600" letter-spacing="6" fill="white" opacity="0.95">THRIVE</text>

  <!-- Subtitle -->
  <text x="124" y="310" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="white" opacity="0.7" letter-spacing="4">FAMILY COUNSELING</text>

  <!-- Divider line -->
  <line x1="124" y1="335" x2="420" y2="335" stroke="white" stroke-width="1" opacity="0.25"/>

  <!-- Location & info -->
  <text x="124" y="375" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="white" opacity="0.6" letter-spacing="1">Naperville, IL  ·  Telehealth Across Illinois</text>

  <!-- Phone -->
  <text x="124" y="410" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="white" opacity="0.75" letter-spacing="1.5">(630) 557-6933</text>

  <!-- Defs -->
  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="1200" y2="628">
      <stop offset="0%" stop-color="#4A6B5A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6B8B7A" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
</svg>
